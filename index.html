<transition name="modal-fade">
    <div v-if="showDietModal" class="fixed inset-0 z-[200] bg-black/80 flex items-center justify-center p-4" @click="showDietModal = false">
        <div class="bg-white w-full max-w-sm rounded-[40px] overflow-hidden shadow-2xl transition-all" @click.stop>
            
            <div class="bg-rose-500 pt-8 pb-6 px-6 text-center">
                <div class="inline-block bg-white/20 rounded-full px-4 py-1 mb-2">
                    <span class="text-white text-xs font-black tracking-widest uppercase">Special Request</span>
                </div>
                <h2 class="text-white text-2xl font-black">食事のお願い</h2>
            </div>

            <div class="p-8 space-y-8">
                <div class="text-center pb-4 border-b border-rose-50">
                    <p class="text-rose-500 text-2xl font-black mb-1">私は妊婦です。</p>
                    <p class="text-gray-400 text-xs font-bold">（我是孕婦）</p>
                </div>

                <div class="space-y-6">
                    <div class="flex items-start">
                        <div class="text-2xl mr-4">🚫</div>
                        <div>
                            <p class="text-xl font-black text-gray-800 leading-none">アルコール</p>
                            <p class="text-xs text-rose-400 font-bold mt-1">（酒・みりん）</p>
                        </div>
                    </div>

                    <div class="flex items-start">
                        <div class="text-2xl mr-4">🚫</div>
                        <div>
                            <p class="text-xl font-black text-gray-800 leading-none">ネギ・玉ねぎ</p>
                            <p class="text-xs text-rose-400 font-bold mt-1">（青蔥・洋蔥）</p>
                        </div>
                    </div>

                    <div class="flex items-start">
                        <div class="text-2xl mr-4">🔥</div>
                        <div>
                            <p class="text-xl font-black text-gray-800 leading-none">生ものは加熱する</p>
                            <p class="text-xs text-rose-400 font-bold mt-1">（肉・魚・卵務必全熟）</p>
                        </div>
                    </div>
                </div>

                <div class="bg-rose-50 rounded-2xl p-4 text-center">
                    <p class="text-rose-600 font-black text-sm">ご配慮ありがとうございます。</p>
                    <p class="text-rose-300 text-[10px] mt-1">（謝謝您的協助與體諒）</p>
                </div>
            </div>

            <button @click="showDietModal = false" class="w-full py-5 bg-gray-50 text-gray-400 font-black text-xs tracking-[0.2em] uppercase active:bg-gray-100 transition-colors">
                Tap to Close ✕
            </button>
        </div>
    </div>
</transition>
